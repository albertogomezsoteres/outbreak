[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "outbreak"
version = "0.1.0"
description = "Outbreak: which AI agents catch a forbidden shortcut from a peer, why, and where to put the guardrail."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Alberto Gomez Soteres" }]
keywords = ["ai-safety", "multi-agent", "llm-agents", "explainability", "red-teaming", "evaluation"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "numpy>=1.26",
  "pandas>=2.1",
  "scipy>=1.11",
  "statsmodels>=0.14",
  "scikit-learn>=1.4",
  "matplotlib>=3.8",
  "pydantic>=2.5",
  "pyyaml>=6.0",
  "openai>=1.40",
  "joblib>=1.3",
  "tabulate>=0.9",
  # pytest is a *runtime* dependency: every task workspace ships a real test suite that agents run.
  "pytest>=8.0",
]

[project.optional-dependencies]
api = ["fastapi>=0.110", "uvicorn>=0.27", "httpx>=0.27"]
tracking = ["wandb>=0.17"]
poster = ["segno>=1.6"]
whitebox = ["torch>=2.2", "transformers>=4.44", "accelerate>=0.30"]
dev = ["hypothesis>=6.100", "pytest-xdist>=3.5", "ruff>=0.5", "mypy>=1.10", "pre-commit>=3.7", "types-PyYAML",
       "fastapi>=0.110", "httpx>=0.27", "ipython>=8"]

[project.scripts]
outbreak = "outbreak.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
outbreak = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
  "slow: statistical calibration and end-to-end tests (deselect with -m 'not slow')",
  "whitebox: needs torch + transformers",
  "network: needs an API key and network access (never run in CI)",
]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 110
target-version = "py310"
src = ["src", "tests"]
# The pilot harness is archived exactly as it ran (provenance of data/raw/pilot); never reformat it.
extend-exclude = ["scripts/pilot"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501", "RUF001", "RUF002", "RUF003"]

[tool.mypy]
python_version = "3.12"
packages = ["outbreak"]
mypy_path = "src"
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = true
no_implicit_optional = true
